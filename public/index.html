<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Elevance Community</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast"></div>

<header class="topbar">
  <div class="brand">Elevance<span>Community</span></div>
  <nav id="nav" class="hidden">
    <button data-page="home">Home</button>
    <button data-page="questions">Q&A</button>
    <button data-page="social">Social</button>
    <button data-page="plans">Plans</button>
    <button data-page="profile">Profile</button>
    <button id="logout">Logout</button>
  </nav>
</header>

<main>
<section id="authPage" class="auth-grid">
  <div class="hero">
    <p class="eyebrow">REAL TIME WEB PLATFORM</p>
    <h1>Ask. Connect. Learn. Earn.</h1>
    <p>A complete internship-ready community platform with secure login, rewards, multilingual verification, social feed and subscriptions.</p>
    <div class="feature-row"><span>🔐 Secure auth</span><span>⚡ Real-time</span><span>🌐 6 languages</span></div>
  </div>
  <div class="card auth-card">
    <div class="tabs"><button class="active" id="loginTab">Login</button><button id="registerTab">Register</button></div>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <input id="loginOtp" placeholder="OTP (only when requested)" hidden>
      <button class="primary">Login</button>
      <button type="button" class="link" id="forgotLink">Forgot password?</button>
    </form>
    <form id="registerForm" class="hidden">
      <input id="regName" placeholder="Full name" required>
      <input id="regEmail" type="email" placeholder="Email" required>
      <input id="regPhone" placeholder="Mobile number" required>
      <input id="regPassword" type="password" placeholder="Password" required>
      <button class="primary">Create account</button>
    </form>
    <div class="demo">Demo: <b>demo@elevance.test</b> / <b>Demo@123</b></div>
  </div>
</section>

<section id="appPage" class="hidden">
  <div id="pageContent"></div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="x" id="closeModal">×</button><div id="modalContent"></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
